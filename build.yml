name: Build Windows + macOS
on:
  push:
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RingThink-VST3-Windows
          path: build/RingThingSSB_artefacts/Release/VST3/

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign (ad-hoc) and zip
        run: |
          mkdir -p out
          for b in build/RingThingSSB_artefacts/VST3/*.vst3 build/RingThingSSB_artefacts/AU/*.component; do
            codesign --force --deep --sign - "$b"
            ditto "$b" "out/$(basename "$b")"
          done
          cd out && ls -la
      - name: Upload macOS plugins
        uses: actions/upload-artifact@v4
        with:
          name: RingThink-macOS-VST3-AU
          path: out/
